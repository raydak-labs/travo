services:
  frontend:
    image: node:26-alpine@sha256:40cd011b55415bc894e45b02fdd5a5dfde056921b7d23a64c74f80497af48797
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - frontend_node_modules:/app/frontend/node_modules
      - shared_node_modules:/app/shared/node_modules
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=development
    command: sh -c "corepack enable && corepack prepare pnpm@12.6.0 --activate && pnpm install && pnpm dev --host"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
    ports:
      - '3000:3000'
    environment:
      - MOCK_MODE=true
      - PORT=3000

volumes:
  frontend_node_modules:
  shared_node_modules:
  go_mod_cache:
