min_version = "2024.1.0"

[tools]
  # Go toolchain
  go = "1.27.1"
  golangci-lint = "2.14.0"
  "go:golang.org/x/tools/cmd/goimports" = "v0.50.0"

  # Node.js + JS tooling
  node = "26.10.0" # or "lts" / "latest"
  #bun = "latest"
  pnpm = "12.6.0"

  # Shell linting for scripts/ and test/integration/
  shellcheck = "0.11.0"

  # Python
  python = "3.14.8"

[settings]
  experimental = true
  jobs = 4
