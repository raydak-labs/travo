min_version = "2024.1.0"

[tools]
  # Go toolchain
  # Must match the `go` directive in backend/go.mod: CI resolves Go from
  # go-version-file, so a mismatch here means developers and CI compile against
  # different patch releases and nothing notices. Enforced by TestGoVersionPinsAgree.
  go = "1.27.0"
  golangci-lint = "2.14.0"
  "go:golang.org/x/tools/cmd/goimports" = "v0.51.0"

  # Node.js + JS tooling
  node = "26.10.0" # or "lts" / "latest"
  #bun = "latest"
  pnpm = "12.8.2"

  # Shell linting for scripts/ and test/integration/
  shellcheck = "0.11.0"

  # Python
  python = "3.14.8"

[settings]
  experimental = true
  jobs = 4
