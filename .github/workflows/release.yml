name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify CI green on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release must never ship from a red main: re-run the CI checks against
      # the exact tagged commit and fail the release when anything is red.
      - name: Run backend, frontend, lint and format gates
        uses: ./.github/workflows/ci.yml

  build-and-release:
    name: Build (${{ matrix.arch }})
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
            arch: aarch64
            package_arch: aarch64_cortex-a53
          - goos: linux
            goarch: amd64
            arch: x86_64
            package_arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Read pinned toolchain versions
        id: toolchain
        run: make toolchain-versions >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # main.BuildTime doubles as the time-sync plausibility floor (see
      # cmd/server/main.go); a release that omits it falls back to a hardcoded
      # 2025-01-01 floor and weakens the unauthenticated time-sync gate.
      - name: Stamp build time
        id: buildmeta
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile backend
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_TIME: ${{ steps.buildmeta.outputs.BUILD_TIME }}
        run: |
          go build \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
            -o "../dist/travo" \
            ./cmd/server

      - name: Build install tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ARCH: ${{ matrix.package_arch }}
        run: bash scripts/package-tarball.sh

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp dist/travo_*.tar.gz artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.arch }}
          path: artifacts/*
          retention-days: 5

  create-release:
    name: Create Release
    needs: [verify, build-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      # Idempotent: GitHub UI "Publish release" creates the release before the
      # tag-push workflow runs. softprops/action-gh-release handled that; plain
      # `gh release create` does not — upload into an existing release instead.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPOSITORY: ${{ github.repository }}
        run: |
          NOTES="$(cat <<EOF
          ## Quick Install (OpenWRT)

          \`\`\`sh
          wget -O- https://raw.githubusercontent.com/${REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`

          Or install a specific version:

          \`\`\`sh
          VERSION=${VERSION} \\
            wget -O- https://raw.githubusercontent.com/${REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`

          ## Downloads

          | Architecture | Install tarball |
          |---|---|
          | aarch64 (GL.iNet MT3000/AXT1800) | \`travo_${VERSION}_aarch64_cortex-a53.tar.gz\` |
          | x86_64 | \`travo_${VERSION}_x86_64.tar.gz\` |

          See [SHA256SUMS](SHA256SUMS) for checksums.
          EOF
          )"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets"
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --generate-notes \
              artifacts/* \
              --notes "${NOTES}"
          fi
