name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # workflow_dispatch makes a release possible from a branch that is not a tag.
  # Nothing downstream noticed: VERSION came out empty, the artifacts were named
  # travo__aarch64_cortex-a53.tar.gz, and the only layout check lives in ci.yml
  # with its own hardcoded VERSION, so the release published a filename no
  # install.sh can resolve. Fail here instead, before anything is built.
  guard:
    name: Verify the release ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a vMAJOR.MINOR.PATCH tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::a release must be cut from a tag, not ${REF_TYPE} ${REF_NAME}"
            exit 1
          fi
          if ! echo "${REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::${REF_NAME} is not a v<semver> tag; the version is baked " \
              "into the tarball name install.sh has to resolve"
            exit 1
          fi

  # A release must never ship from a red main: re-run the CI checks against the
  # exact tagged commit and fail the release when anything is red.
  #
  # A reusable workflow is called at the job level, never from steps — a job that
  # calls one has no runs-on and no steps of its own. $/.github/workflows/<file> is
  # the documented same-repository form (GitHub's recommended syntax; it resolves
  # against this repository, not the caller's workspace) and, like ./, resolves
  # to the caller's own commit. It must not carry an @ref.
  verify:
    name: Verify CI green on the tagged commit
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-release:
    name: Build (${{ matrix.arch }})
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
            arch: aarch64
            package_arch: aarch64_cortex-a53
          - goos: linux
            goarch: amd64
            arch: x86_64
            package_arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Read pinned toolchain versions
        id: toolchain
        run: make toolchain-versions >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # main.BuildTime doubles as the time-sync plausibility floor (see
      # cmd/server/main.go); a release that omits it falls back to a hardcoded
      # 2025-01-01 floor and weakens the unauthenticated time-sync gate.
      - name: Stamp build time
        id: buildmeta
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile backend
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_TIME: ${{ steps.buildmeta.outputs.BUILD_TIME }}
        run: |
          go build \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
            -o "../dist/travo" \
            ./cmd/server

      - name: Build install tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ARCH: ${{ matrix.package_arch }}
        run: bash scripts/package-tarball.sh

      # The layout check in ci.yml runs against its own VERSION=0.0.0 tarball,
      # so on the release path it verified a different artifact from the one
      # that ships. Check the real one: install.sh resolves it by name and
      # unpacks it as /.
      - name: Verify the release tarball is install.sh-resolvable
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ARCH: ${{ matrix.package_arch }}
        run: |
          set -euo pipefail
          tarball="dist/travo_${VERSION}_${ARCH}.tar.gz"
          if [ ! -f "${tarball}" ]; then
            echo "::error::package-tarball.sh produced no ${tarball}"; ls -l dist
            exit 1
          fi
          listing="$(tar -tzf "${tarball}")"
          for p in \
            ./usr/bin/travo \
            ./etc/init.d/travo \
            ./etc/config/travo \
            ./etc/uci-defaults/99-travel-gui-ports \
            ./lib/upgrade/keep.d/travo \
            ./www/travo/index.html ; do
            echo "${listing}" | grep -qx "${p}" \
              || { echo "::error::${tarball} is missing ${p}"; echo "${listing}"; exit 1; }
          done
          if echo "${listing}" | grep -qE '^\.\./'; then
            echo "::error::${tarball} contains paths escaping /"; exit 1
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp dist/travo_*.tar.gz artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: artifacts/*
          retention-days: 5

  create-release:
    name: Create Release
    needs: [verify, build-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      # Idempotent: GitHub UI "Publish release" creates the release before the
      # tag-push workflow runs. softprops/action-gh-release handled that; plain
      # `gh release create` does not — upload into an existing release instead.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPOSITORY: ${{ github.repository }}
        run: |
          NOTES="$(cat <<EOF
          ## Quick Install (OpenWRT)

          There is no default password: pass your own, or run the script from a
          terminal to be prompted.

          \`\`\`sh
          wget -O- https://raw.githubusercontent.com/${REPOSITORY}/main/scripts/install.sh | \
            sh -s -- --password 'your-strong-password'
          \`\`\`

          Or install a specific version:

          \`\`\`sh
          VERSION=${VERSION} \\
            wget -O- https://raw.githubusercontent.com/${REPOSITORY}/main/scripts/install.sh | \
            sh -s -- --password 'your-strong-password'
          \`\`\`

          ## Downloads

          | Architecture | Install tarball |
          |---|---|
          | aarch64 (GL.iNet MT3000/AXT1800) | \`travo_${VERSION}_aarch64_cortex-a53.tar.gz\` |
          | x86_64 | \`travo_${VERSION}_x86_64.tar.gz\` |

          See [SHA256SUMS](SHA256SUMS) for checksums.
          EOF
          )"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets"
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --generate-notes \
              artifacts/* \
              --notes "${NOTES}"
          fi
